<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2332">
<title>আমার রিপোর্ট</title>
<style>
/* ===================== RESET ===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a2332;
  color: #e8edf3;
  min-height: 100vh;
  font-size: 15px;
}

/* ===================== HEADER ===================== */
.page-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 20px;
  background: #1a2332;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: #e8edf3;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
}

.back-btn:active {
  background: rgba(255, 255, 255, 0.08);
}

.page-title {
  font-size: 20px;
  font-weight: 600;
  color: #ffffff;
  flex: 1;
}

/* ===================== CONTAINER ===================== */
.container {
  padding: 0 16px 32px;
  max-width: 520px;
  margin: 0 auto;
}

/* ===================== REPORT LIST ===================== */
.report-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.report-item {
  background: #232f42;
  border-radius: 12px;
  padding: 14px 16px;
}

.report-time {
  font-size: 17px;
  font-weight: 600;
  color: #fbbf24;
  margin-bottom: 4px;
}

.report-date {
  font-size: 13px;
  color: #8892a6;
  margin-bottom: 8px;
}

.report-note {
  font-size: 14px;
  line-height: 1.6;
  color: #cbd5e1;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  word-break: break-word;
}

.report-note:empty {
  display: none;
}

/* ===================== EMPTY STATE ===================== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: #5a6478;
}

.empty-state .icon {
  font-size: 48px;
  margin-bottom: 14px;
  opacity: 0.5;
}

.empty-state p {
  font-size: 15px;
}
</style>
</head>
<body>

<header class="page-header">
  <button class="back-btn" onclick="history.back()">🔙</button>
  <h1 class="page-title">আমার রিপোর্ট</h1>
</header>

<div class="container">
  <div class="report-list" id="reportList"></div>
</div>

<script>
// HTML এস্কেপ (নিরাপত্তার জন্য)
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function loadReports() {
  const reports = JSON.parse(localStorage.getItem('reports') || '[]');
  const list = document.getElementById('reportList');

  if (reports.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>এখনো কোনো রিপোর্ট নেই</p>
      </div>
    `;
    return;
  }

  list.innerHTML = reports.map(r => {
    // তারিখ ফরম্যাট
    const date = new Date(r.endTime || r.timestamp || Date.now());
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    let h = date.getHours();
    const m = String(date.getMinutes()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    const hourStr = String(h).padStart(2, '0');
    const dateStr = `${day}/${month}/${year}, ${hourStr}:${m} ${ampm}`;

    // দিন গণনা
    const days = Math.floor((r.seconds || 0) / 86400);
    const dayText = days > 0 ? `${days} দিন` : '0 দিন';

    // নোট
    const noteText = r.note && r.note.trim() ? r.note.trim() : '';
    const noteHtml = noteText
      ? `<div class="report-note">${escapeHtml(noteText)}</div>`
      : '';

    return `
      <div class="report-item">
        <div class="report-time">⏱️ ${dayText}</div>
        <div class="report-date">${dateStr}</div>
        ${noteHtml}
      </div>
    `;
  }).join('');
}

loadReports();
</script>
</body>
  </html>
