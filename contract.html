<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2332">
<title>Contract</title>
<style>
/* ===================== RESET ===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a2332;
  color: #e8edf3;
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.7;
}

/* ===================== HEADER ===================== */
.page-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 20px;
  background: #1a2332;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: #e8edf3;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
}

.back-btn:active {
  background: rgba(255, 255, 255, 0.08);
}

.page-title {
  font-size: 18px;
  font-weight: 600;
  color: #ffffff;
  flex: 1;
}

/* ===================== CONTAINER ===================== */
.container {
  padding: 0 16px 40px;
  max-width: 520px;
  margin: 0 auto;
}

/* ===================== INTRO ===================== */
.intro {
  text-align: center;
  padding: 10px 10px 24px;
  color: #94a3b8;
  font-size: 14.5px;
  line-height: 1.8;
}

.intro strong {
  color: #fbbf24;
}

/* ===================== CONTACT CARD ===================== */
.contact-card {
  background: #212d3f;
  border-radius: 14px;
  padding: 18px 20px;
  margin-bottom: 16px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: all 0.2s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.contact-card:active {
  transform: scale(0.98);
  background: #2a3a52;
}

.contact-icon {
  width: 54px;
  height: 54px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
  color: #ffffff;
}

.contact-icon.facebook {
  background: #1877f2;
  box-shadow: 0 4px 12px rgba(24, 119, 242, 0.3);
}

.contact-icon.email {
  background: #ea4335;
  box-shadow: 0 4px 12px rgba(234, 67, 53, 0.3);
}

.contact-info {
  flex: 1;
  min-width: 0;
}

.contact-label {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 500;
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.contact-value {
  font-size: 15px;
  color: #ffffff;
  font-weight: 600;
  word-break: break-all;
  line-height: 1.4;
}

/* ===================== COPY BUTTON ===================== */
.copy-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.03);
  color: #94a3b8;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 16px;
  flex-shrink: 0;
  transition: all 0.2s;
  z-index: 2;
}

.copy-btn:active {
  background: rgba(255, 255, 255, 0.1);
  transform: scale(0.95);
}

.copy-btn.copied {
  color: #4ade80;
  border-color: rgba(74, 222, 128, 0.4);
  background: rgba(74, 222, 128, 0.1);
}

/* ===================== NOTE ===================== */
.note {
  background: rgba(251, 191, 36, 0.06);
  border: 1px solid rgba(251, 191, 36, 0.2);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 13px;
  color: #cbd5e1;
  line-height: 1.7;
  margin-top: 20px;
  text-align: center;
}

.note-title {
  font-size: 12.5px;
  font-weight: 600;
  color: #fbbf24;
  margin-bottom: 6px;
  letter-spacing: 0.3px;
}

/* ===================== TOAST ===================== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #16a34a;
  color: #ffffff;
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 6px 20px rgba(22, 163, 74, 0.3);
  z-index: 2000;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="page-header">
  <button class="back-btn" onclick="history.back()">🔙</button>
  <h1 class="page-title">Contract</h1>
</header>

<div class="container">

  <!-- ===================== INTRO ===================== -->
  <div class="intro">
    অ্যাপটি নিয়ে আপনার যেকোনো পরামর্শ, অভিযোগ বা মতামত থাকলে আমাদের সাথে যোগাযোগ করুন। 
  </div>

  <!-- ===================== FACEBOOK ===================== -->
  <!-- ⚠️ নিচের লিংকে আপনার ফেসবুক প্রোফাইল বা গ্রুপের লিংক বসান -->
  <a href="https://www.facebook.com/profile.php?id=61571871835639" 
     target="_blank" 
     rel="noopener noreferrer"
     class="contact-card">
    <div class="contact-icon facebook">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
    </div>
    <div class="contact-info">
      <div class="contact-label">Facebook</div>
      <div class="contact-value">Alor Poth</div>
    </div>
    <button class="copy-btn" onclick="copyLink(event, 'https://www.facebook.com/profile.php?id=61571871835639')" title="লিংক কপি করুন">
      📋
    </button>
  </a>

  <!-- ===================== EMAIL ===================== -->
  <!-- ⚠️ নিচের ইমেইলে আপনার আসল ইমেইল বসান -->
  <a href="#" 
     class="contact-card">
    <div class="contact-icon email">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
      </svg>
    </div>
    <div class="contact-info">
      <div class="contact-label">Email</div>
      <div class="contact-value">muhibbullahlion@gmail.com</div>
    </div>
    <button class="copy-btn" onclick="copyLink(event, 'muhibbullahlion@gmail.com')" title="ইমেইল কপি করুন">
      📋
    </button>
  </a>

<!-- ===================== TOAST ===================== -->
<div class="toast" id="toast">কপি হয়েছে</div>

<script>
// ============================================================
//                  COPY FUNCTION
// ============================================================

function copyLink(event, text) {
  // ⭐ লিংকে ক্লিক করে পেজ পরিবর্তন হওয়া বন্ধ করি
  event.preventDefault();
  event.stopPropagation();

  // আধুনিক ক্লিপবোর্ড API
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showFeedback(event.target))
      .catch(() => fallbackCopy(text, event.target));
  } else {
    fallbackCopy(text, event.target);
  }
}

function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showFeedback(btn);
  } catch (err) {
    alert('কপি করা যায়নি');
  }
  document.body.removeChild(ta);
}

function showFeedback(btn) {
  const orig = btn.innerHTML;
  btn.classList.add('copied');
  btn.innerHTML = '✓';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = orig;
  }, 1500);
  showToast();
}

// ============================================================
//                  TOAST
// ============================================================

let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
