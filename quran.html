<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2332">
<title>কিছু হাদিস ও কোরআন</title>
<style>
/* ===================== RESET ===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a2332;
  color: #e8edf3;
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.75;
}

/* ===================== HEADER ===================== */
.page-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 16px 20px;
  background: #1a2332;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: #e8edf3;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
}

.back-btn:active {
  background: rgba(255, 255, 255, 0.08);
}

.page-title {
  font-size: 18px;
  font-weight: 600;
  color: #ffffff;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ===================== TABS ===================== */
.tabs {
  display: flex;
  gap: 8px;
  padding: 0 16px 16px;
  max-width: 520px;
  margin: 0 auto;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  flex-shrink: 0;
  padding: 8px 16px;
  background: #212d3f;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 20px;
  color: #94a3b8;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.tab.active {
  background: #4f46e5;
  border-color: #4f46e5;
  color: #ffffff;
}

.tab:active {
  transform: scale(0.97);
}

/* ===================== CONTAINER ===================== */
.container {
  padding: 0 16px 40px;
  max-width: 520px;
  margin: 0 auto;
}

/* ===================== ENTRY CARD ===================== */
.entry {
  background: #212d3f;
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 14px;
  border-left: 3px solid #4f46e5;
}

.entry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.entry-tag {
  font-size: 12px;
  color: #a5b4fc;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.copy-btn {
  padding: 5px 12px;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  color: #a5b4fc;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.copy-btn:active {
  background: rgba(255, 255, 255, 0.06);
}

.copy-btn.copied {
  color: #4ade80;
  border-color: rgba(74, 222, 128, 0.4);
}

/* ===================== ARABIC (ঐচ্ছিক) ===================== */
.entry-arabic {
  font-size: 22px;
  color: #fef3c7;
  line-height: 1.9;
  text-align: right;
  margin-bottom: 14px;
  font-family: 'Traditional Arabic', 'Amiri', 'Noto Naskh Arabic', serif;
  direction: rtl;
  padding: 4px 0;
}

/* ===================== BANGLA MEANING ===================== */
.entry-text {
  font-size: 15.5px;
  color: #e2e8f0;
  line-height: 1.9;
  text-align: justify;
}

.entry-text strong {
  color: #fbbf24;
  font-weight: 600;
}

/* ===================== SOURCE ===================== */
.entry-source {
  display: block;
  text-align: right;
  margin-top: 12px;
  font-size: 13px;
  color: #fbbf24;
  font-weight: 500;
}

/* ===================== SECTION DIVIDER ===================== */
.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 26px 0 14px;
  color: #64748b;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.section-label::before,
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.06);
}

/* ===================== EMPTY ===================== */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: #64748b;
  font-size: 15px;
}

/* ===================== TOAST ===================== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #16a34a;
  color: #ffffff;
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: 0 6px 20px rgba(22, 163, 74, 0.3);
  z-index: 2000;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ===================== FOOTER ===================== */
.footer-note {
  text-align: center;
  margin-top: 30px;
  padding: 16px;
  color: #64748b;
  font-size: 13px;
  line-height: 1.7;
}
</style>
</head>

<div class="container" id="content"></div>

<!-- ===================== TOAST ===================== -->

// ============================================================
//                  RENDER
// ============================================================

let currentTab = 'all';

function render() {
  const container = document.getElementById('content');
  const filtered = currentTab === 'all'
    ? ENTRIES
    : ENTRIES.filter(e => e.type === currentTab);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">কোনো কনটেন্ট নেই</div>';
    return;
  }

  container.innerHTML = filtered.map((e, i) => {
    const arabicHtml = e.arabic
      ? `<div class="entry-arabic">${e.arabic}</div>`
      : '';

    return `
      <div class="entry">
        <div class="entry-header">
          <span class="entry-tag">${e.tag}</span>
          <button class="copy-btn" onclick="copyEntry(this, ${ENTRIES.indexOf(e)})">কপি</button>
        </div>
        ${arabicHtml}
        <p class="entry-text">${e.text}</p>
        <span class="entry-source">${e.source}</span>
      </div>
    `;
  }).join('');
}

// ============================================================
//                  TABS
// ============================================================

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.getAttribute('data-tab');
    render();
  });
});

// ============================================================
//                  COPY
// ============================================================

function copyEntry(btn, index) {
  const e = ENTRIES[index];
  if (!e) return;

  let text = '';
  if (e.arabic) text += e.arabic + '\n\n';
  text += stripHtml(e.text) + '\n\n';
  text += e.source;

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showCopied(btn))
      .catch(() => fallbackCopy(text, btn));
  } else {
    fallbackCopy(text, btn);
  }
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || '';
}

function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showCopied(btn);
  } catch (err) {
    alert('কপি করা যায়নি');
  }
  document.body.removeChild(ta);
}

function showCopied(btn) {
  const orig = btn.textContent;
  btn.classList.add('copied');
  btn.textContent = '✓';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.textContent = orig;
  }, 1500);
  showToast();
}

// ============================================================
//                  TOAST
// ============================================================

let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

// ============================================================
//                  INIT
// ============================================================

render();
</script>
