<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2332">
<title>My Report</title>
<style>
/* ===================== RESET ===================== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a2332;
  color: #e8edf3;
  min-height: 100vh;
  font-size: 15px;
}

/* ===================== HEADER ===================== */
.header {
  text-align: center;
  padding: 20px 16px 22px;
  background: #1a2332;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.3px;
}

/* ===================== CONTAINER ===================== */
.container {
  padding: 0 16px 32px;
  max-width: 520px;
  margin: 0 auto;
}

/* ===================== REPORT CARD ===================== */
.report-card {
  background: #2c3a4f;
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

.card-day {
  font-size: 26px;
  font-weight: 700;
  color: #ffffff;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
  line-height: 1.2;
}

.card-row {
  font-size: 15.5px;
  color: #cbd5e1;
  line-height: 1.9;
  font-weight: 400;
  word-break: break-word;
}

.card-row .label {
  color: #cbd5e1;
  font-weight: 500;
}

/* ===================== EMPTY STATE ===================== */
.empty-state {
  text-align: center;
  padding: 70px 20px;
  color: #5a6478;
}

.empty-state .icon {
  font-size: 60px;
  margin-bottom: 18px;
  opacity: 0.4;
}

.empty-state p {
  font-size: 16px;
  font-weight: 500;
}
</style>
</head>
<body>

<header class="header">
  <h1>My Report</h1>
</header>

<div class="container" id="reportList"></div>

<script>
// ===================== DATE TIME FORMAT =====================
function formatDateTime(isoString) {
  if (!isoString) return '—';
  const d = new Date(isoString);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();

  let hours = d.getHours();
  const minutes = String(d.getMinutes()).padStart(2, '0');
  const seconds = String(d.getSeconds()).padStart(2, '0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;
  const h = String(hours).padStart(2, '0');

  return `${day}/${month}/${year}, ${h}:${minutes}:${seconds} ${ampm}`;
}

// ===================== LOAD REPORTS =====================
function loadReports() {
  const reports = JSON.parse(localStorage.getItem('reports') || '[]');
  const list = document.getElementById('reportList');

  if (reports.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>এখনো কোনো রিপোর্ট নেই</p>
      </div>
    `;
    return;
  }

  list.innerHTML = reports.map(r => {
    const startStr = r.startTime ? formatDateTime(r.startTime) : '—';
    const endStr = r.endTime ? formatDateTime(r.endTime) :
                   (r.timestamp ? formatDateTime(r.timestamp) : '—');
    const dayText = Math.floor((r.seconds || 0) / 86400) + ' Day';

    return `
      <div class="report-card">
        <div class="card-day">${dayText}</div>
        <div class="card-row"><span class="label">start></span> ${startStr}</div>
        <div class="card-row"><span class="label">close></span> ${endStr}</div>
      </div>
    `;
  }).join('');
}

// ===================== INIT =====================
loadReports();
</script>
</body>
</html>
