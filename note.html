<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a2332">
    <title>আমার নোট</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../firebase-auth.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a2332;
  color: #e8edf3;
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.7;
}

.page-header {
  display: flex; align-items: center; gap: 10px;
  padding: 18px 16px 20px;
  background: #1a2332;
  position: sticky; top: 0; z-index: 10;
}

.back-btn {
  width: 38px; height: 38px; border-radius: 50%;
  border: none; background: transparent; color: #e8edf3;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 20px;
}
.back-btn:active { background: rgba(255, 255, 255, 0.08); }

.page-title { font-size: 18px; font-weight: 600; color: #ffffff; flex: 1; }

.container { padding: 0 16px 40px; max-width: 520px; margin: 0 auto; }

.new-note {
  background: #212d3f; border-radius: 12px;
  padding: 14px 16px; margin-bottom: 20px;
  border-left: 3px solid #4f46e5;
}

.note-input {
  width: 100%; background: transparent; border: none;
  color: #e8edf3; font-family: inherit; font-size: 15px;
  line-height: 1.7; resize: none; outline: none;
  min-height: 60px; margin-bottom: 10px;
}
.note-input::placeholder { color: #64748b; }

.note-actions { display: flex; justify-content: flex-end; gap: 8px; }

.btn {
  padding: 8px 18px; border: none; border-radius: 8px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.btn:active { transform: scale(0.97); }

.btn-primary { background: #4f46e5; color: #ffffff; }
.btn-primary:active { background: #4338ca; }

.btn-ghost {
  background: transparent; color: #94a3b8;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.btn-ghost:active { background: rgba(255, 255, 255, 0.05); }

.notes-list { display: flex; flex-direction: column; gap: 10px; }

.note-card {
  background: #212d3f; border-radius: 12px;
  padding: 14px 16px;
  border-left: 3px solid #4ade80;
  position: relative;
}

.note-text {
  font-size: 15px; color: #e2e8f0;
  line-height: 1.75; white-space: pre-wrap;
  word-break: break-word; margin-bottom: 10px;
}

.note-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}

.note-date { font-size: 12px; color: #64748b; }
.note-buttons { display: flex; gap: 6px; }

.icon-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: none; background: transparent; color: #94a3b8;
  font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.icon-btn:active { background: rgba(255, 255, 255, 0.08); }
.icon-btn.edit:active { color: #a5b4fc; }
.icon-btn.delete:active { color: #f87171; }

.empty { text-align: center; padding: 70px 20px; color: #64748b; }
.empty-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.5; }
.empty p { font-size: 15px; }

.note-card.editing { border-left-color: #fbbf24; }
.note-card.editing .note-text { display: none; }

.edit-area {
  display: none; width: 100%;
  background: #141c28; border: 1.5px solid #4f46e5;
  border-radius: 8px; color: #e8edf3;
  font-family: inherit; font-size: 15px; line-height: 1.7;
  padding: 10px 12px; resize: vertical; outline: none;
  min-height: 70px; margin-bottom: 10px;
}
.note-card.editing .edit-area { display: block; }

.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #16a34a; color: #ffffff;
  padding: 10px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 500;
  box-shadow: 0 6px 20px rgba(22, 163, 74, 0.3);
  z-index: 2000; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.danger { background: #dc2626; box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3); }
</style>
</head>
<body>

<header class="page-header">
  <button class="back-btn" onclick="history.back()">🔙</button>
  <h1 class="page-title">আমার নোট</h1>
</header>

<div class="container">

  <div class="new-note">
    <textarea id="noteInput" class="note-input" placeholder="Write a note" rows="2"></textarea>
    <div class="note-actions">
      <button class="btn btn-ghost" id="clearBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save</button>
    </div>
  </div>

  <div class="notes-list" id="notesList"></div>

</div>

<div class="toast" id="toast">Saved</div>

<script>
// ============================================================
//                  STORAGE
// ============================================================

const STORAGE_KEY = 'myNotes';

function loadNotes() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function saveNotes(notes) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  
  // ⭐ নোট সেভ হলেই ক্লাউডে সিঙ্ক
  if (window.FirebaseAuth && window.FirebaseAuth.syncToCloud) {
    window.FirebaseAuth.syncToCloud();
  }
}

// ============================================================
//                  HELPERS
// ============================================================

function formatDate(isoString) {
  const d = new Date(isoString);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const hourStr = String(h).padStart(2, '0');
  return `${day}/${month}/${year} • ${hourStr}:${m} ${ampm}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

// ============================================================
//                  RENDER
// ============================================================

let editingId = null;

function render() {
  const notes = loadNotes();
  const list = document.getElementById('notesList');

  if (notes.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🗒️</div>
        <p>Data no found</p>
      </div>
    `;
    return;
  }

  list.innerHTML = notes.map(n => {
    const isEditing = editingId === n.id;
    return `
      <div class="note-card ${isEditing ? 'editing' : ''}" data-id="${n.id}">
        <div class="note-text">${escapeHtml(n.text)}</div>

        <textarea class="edit-area" id="edit-${n.id}">${escapeHtml(n.text)}</textarea>

        <div class="note-meta">
          <span class="note-date">${formatDate(n.createdAt)}</span>
          <div class="note-buttons">
            ${isEditing
              ? `<button class="icon-btn" onclick="saveEdit(${n.id})" title="সেভ">💾</button>
                 <button class="icon-btn" onclick="cancelEdit()" title="বাতিল">✖️</button>`
              : `<button class="icon-btn edit" onclick="startEdit(${n.id})" title="এডিট">✏️</button>
                 <button class="icon-btn delete" onclick="deleteNote(${n.id})" title="মুছুন">🗑️</button>`
            }
          </div>
        </div>
      </div>
    `;
  }).join('');

  if (editingId) {
    const ta = document.getElementById('edit-' + editingId);
    if (ta) {
      setTimeout(() => {
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }, 50);
    }
  }
}

// ============================================================
//                  ACTIONS
// ============================================================

document.getElementById('saveBtn').addEventListener('click', () => {
  const input = document.getElementById('noteInput');
  const text = input.value.trim();

  if (!text) {
    showToast('খালি নোট সেভ হবে না', true);
    return;
  }

  const notes = loadNotes();
  notes.unshift({
    id: Date.now(),
    text: text,
    createdAt: new Date().toISOString()
  });
  saveNotes(notes);

  input.value = '';
  input.style.height = 'auto';

  render();
  showToast('নোট সেভ হয়েছে');
});

document.getElementById('clearBtn').addEventListener('click', () => {
  const input = document.getElementById('noteInput');
  input.value = '';
  input.style.height = 'auto';
});

function startEdit(id) {
  editingId = id;
  render();
}

function saveEdit(id) {
  const ta = document.getElementById('edit-' + id);
  if (!ta) return;

  const newText = ta.value.trim();
  if (!newText) {
    showToast('খালি নোট রাখা যাবে না', true);
    return;
  }

  const notes = loadNotes();
  const idx = notes.findIndex(n => n.id === id);
  if (idx >= 0) {
    notes[idx].text = newText;
    notes[idx].updatedAt = new Date().toISOString();
    saveNotes(notes);
  }

  editingId = null;
  render();
  showToast('নোট আপডেট হয়েছে');
}

function cancelEdit() {
  editingId = null;
  render();
}

function deleteNote(id) {
  if (!confirm('এই নোটটি মুছে ফেলবেন?')) return;

  const notes = loadNotes().filter(n => n.id !== id);
  saveNotes(notes);
  render();
  showToast('নোট মুছে ফেলা হয়েছে', true);
}

// ============================================================
//                  TEXTAREA AUTO GROW
// ============================================================

const input = document.getElementById('noteInput');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});

input.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    document.getElementById('saveBtn').click();
  }
});

// ============================================================
//                  TOAST
// ============================================================

let toastTimer;

function showToast(message, isDanger) {
  const t = document.getElementById('toast');
  t.textContent = message;
  t.classList.toggle('danger', !!isDanger);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
//                  CLOUD SYNC ON LOAD
// ============================================================

// ⭐ পেজ লোড হলে ক্লাউড থেকে ডেটা চেক করি (শুধু প্রথমবার)
async function checkCloudData() {
  if (!window.FirebaseAuth) return;
  if (!FirebaseAuth.isLoggedIn()) return;
  
  // ⭐ এই সেশনে আগেই সিঙ্ক হয়েছে কিনা চেক
  if (sessionStorage.getItem('noteSyncDone') === 'true') {
    return; // আগেই সিঙ্ক হয়েছে
  }
  
  try {
    const { db, auth } = window;
    if (!db || !auth) return;
    const user = auth.currentUser;
    if (!user) return;
    
    const docSnap = await db.collection('users').doc(user.uid).get();
    if (docSnap.exists) {
      const data = docSnap.data();
      if (data.myNotes) {
        localStorage.setItem('myNotes', data.myNotes);
        console.log('✅ নোট ক্লাউড থেকে ফিরে এসেছে');
        sessionStorage.setItem('noteSyncDone', 'true');
        render(); // ⭐ নোট রেন্ডার
      }
    }
  } catch (e) {
    console.error('❌ Note sync error:', e);
  }
}

// ⭐ পেজ লোডে ডেটা চেক + রেন্ডার
(async () => {
  // প্রথমে লোকাল ডেটা রেন্ডার
  render();
  
  // তারপর ক্লাউড চেক (যদি লগইন থাকে)
  await checkCloudData();
  
  // ⭐ ক্লাউড থেকে আসার পর আবার রেন্ডার
  render();
})();

// ⭐ authStateChanged এ আবার চেক
window.addEventListener('authStateChanged', async () => {
  await checkCloudData();
  render();
});
</script>
</body>
</html>
